<div class="p-3 col-lg-6 col-md-8 col-sm-10 mx-auto">
    <h2>A szavazás részletei</h2>

    <button class="btn btn-secondary mb-3" (click)="showResults()">Eredmények</button>

    <div>
        <div class="col-6 mb-3" *ngFor="let option of pollOptions">
            {{ option.name }}
            
            <div class="text-end">

                <button class="btn btn-primary btn-sm mx-2" (click)="voteOption(option.id)">Szavazás</button>
                <button class="btn btn-danger btn-sm mx-2" (click)="deleteOption(option.id)">Törlés</button>
            </div>
                
        </div>
    </div>
    <div class="mb-3">
        <input [(ngModel)]="newOptionName" class="form-control mb-3" id="newOptionName" placeholder="Új opció neve">

        <button class="btn btn-success" (click)="newOption()">Új opció hozzáadása</button>
    </div>

</div>
